<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafael Marcos - Portfolio</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-900 text-white">
    <header class="top-0 z-50 w-full fixed bg-gray-900/80 backdrop-blur-md">
        <nav class="flex items-center justify-between p-4 lg:px-8">
            <p class="text-3xl font-bold">Rafael Marcos</p>
            <ul class="inline-flex items-center justify-between px-4 lg:px-8">
                <li><a class="lg:px-4" href="https://blog.rmarcos.dev" target="_blank" rel="noopener noreferrer">Blog</a></li>
                <li><a class="lg:px-4" href="#projects">Projects</a></li>
                <li><a class="lg:px-4" href="#freelas">Freelancing</a></li>
                <li><a class="lg:px-4" href="#contact">Contact</a></li>
                <li><a class="lg:px-4" href="#">CV</a></li>
            </ul>
        </nav>
    </header>
    <section class="relative flex items-center justify-center w-full min-h-screen overflow-hidden">
        <div aria-hidden="true" class="absolute inset-x-0 -top-40 -z-10 transform-gpu blur-3xl sm:-top-80">
            <div style="clip-path: polygon(74.1% 44.1%, 100% 61.6%, 97.5% 26.9%, 85.5% 0.1%, 80.7% 2%, 72.5% 32.5%, 60.2% 62.4%, 52.4% 68.1%, 47.5% 58.3%, 45.2% 34.5%, 27.5% 76.7%, 0.1% 64.9%, 17.9% 100%, 27.6% 76.8%, 76.1% 97.7%, 74.1% 44.1%)" class="relative left-[calc(50%-11rem)] aspect-[1155/678] w-[36.125rem] -translate-x-1/2 rotate-[30deg] bg-linear-to-tr from-[#ff80b5] to-[#9089fc] opacity-30 sm:left-[calc(50%-30rem)] sm:w-[72.1875rem]"></div>
        </div>
        <div aria-hidden="true" class="absolute inset-x-0 top-[calc(100%-13rem)] -z-10 transform-gpu blur-3xl sm:top-[calc(100%-30rem)]">
            <div style="clip-path: polygon(74.1% 44.1%, 100% 61.6%, 97.5% 26.9%, 85.5% 0.1%, 80.7% 2%, 72.5% 32.5%, 60.2% 62.4%, 52.4% 68.1%, 47.5% 58.3%, 45.2% 34.5%, 27.5% 76.7%, 0.1% 64.9%, 17.9% 100%, 27.6% 76.8%, 76.1% 97.7%, 74.1% 44.1%)" class="relative left-[calc(50%+3rem)] aspect-[1155/678] w-[36.125rem] -translate-x-1/2 bg-linear-to-tr from-[#ff80b5] to-[#9089fc] opacity-30 sm:left-[calc(50%+36rem)] sm:w-[72.1875rem]"></div>
        </div>
        <div class="text-9xl px-8">
            <p>ANDROID</p>
            <p>DEVELOPER</p>
        </div>
        <img src="kotlin/kotlin-seeklogo.svg" alt="kotlin logo">
    </section>
    <section class="min-h-screen">
        <h1 id="projects" class="text-4xl font-bold flex justify-center">Projects</h1>
    </section>
    <section class="min-h-screen">
        <h1 id="freelas" class="text-4xl font-bold flex justify-center">Freelancing</h1>
    </section>
    <section id="contact" class="min-h-screen flex flex-col items-center justify-center px-8">
        <h1 class="text-4xl font-bold mb-12">Contact</h1>
        <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="flex flex-col gap-4 w-full max-w-md">
            <input type="email" name="email" placeholder="Your email" required
                   class="bg-gray-800 rounded-md px-4 py-3 text-white border border-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <textarea name="message" placeholder="Your message" rows="5" required
                      class="bg-gray-800 rounded-md px-4 py-3 text-white border border-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            <button type="submit"
                    class="bg-indigo-500 hover:bg-indigo-400 rounded-md px-4 py-3 font-semibold transition cursor-pointer">
                Send Message
            </button>
        </form>
    </section>
</body>
</html>
